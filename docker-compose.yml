services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - autopilot-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    env_file: .env
    command: ["npm", "run", "worker"]
    volumes:
      - autopilot-data:/app/data
    restart: unless-stopped
volumes:
  autopilot-data:
